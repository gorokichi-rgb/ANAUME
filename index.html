<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#A499C9"><link rel="manifest" href="manifest.webmanifest"><title>たんごタイル</title>
<style>
:root{--bg:#E5E5E5;--ac:#A499C9;--tx:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:bold}
button.o{background:#fff;color:var(--tx)}button.d{background:#fff;color:#c33}button:disabled{opacity:.4}
.card{background:#fff;border-radius:12px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{flex:1;padding:22px 10px;font-size:18px}
small,.m{color:#777}
textarea,input[type=text]{width:100%;font:inherit;padding:10px;border:2px solid #fff;border-radius:10px;background:#fff}
textarea{min-height:110px}textarea:focus,input:focus{outline:0;border-color:var(--ac)}
.bl{border-bottom:3px solid var(--ac);font-weight:bold;padding:0 4px}
.sent{background:#fff;border-radius:12px;padding:14px;line-height:2.4}
.slot{display:inline-flex;min-width:64px;min-height:40px;border-bottom:3px solid var(--ac);vertical-align:middle;margin:0 3px;justify-content:center;align-items:center}
.slot .t{margin:0}.ok{background:#d6f0d6}.ng{background:#f6d0d0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.t{background:#fff;border-radius:10px;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;box-shadow:0 2px 0 #bbb}
.t.used{opacity:.25;box-shadow:none}.t img,.chip img{max-height:56px;max-width:90px;border-radius:6px}
.chip{background:#fff;border-radius:8px;padding:4px 8px;display:inline-flex;gap:6px;align-items:center}
.msg{font-weight:bold;text-align:center;margin:10px}
</style></head><body><div id="app"></div><input type="file" id="fi" hidden>
<script>
const $=s=>document.querySelector(s),R=h=>{$('#app').innerHTML=h;scrollTo(0,0)};
let db=JSON.parse(localStorage.getItem('wt')||'{"f":[]}'),E,P;
const save=()=>localStorage.setItem('wt',JSON.stringify(db)),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const th=t=>t.t=='img'?`<img src="${t.v}">`:esc(t.v);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function parse(it){return it.src.split(/(\{[^}]*\})/).filter(x=>x).map(p=>{if(p[0]=='{'&&p.endsWith('}')){const v=p.slice(1,-1);return v[0]=='#'?{b:1,t:'img',v:(it.imgs||{})[v.slice(1)]||''}:{b:1,t:'text',v}}return{t:'text',v:p}})}
const dum=it=>[...(it.dt||'').split(/[,、，]/).map(s=>s.trim()).filter(Boolean).map(v=>({t:'text',v})),...(it.di||[]).map(v=>({t:'img',v}))];
const shrink=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
const pick=(cb,multi)=>{const f=$('#fi');f.accept=multi?'.json,application/json':'image/*';f.multiple=!!multi;f.onchange=()=>{if(f.files.length)cb([...f.files]);f.value=''};f.click()};
const dl=(name,obj)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name+'.json';a.click()};

function home(){R(`<h1>📚 たんごタイル</h1><div class=row><button onclick="addF()">＋ フォルダー追加</button><button class=o onclick="imp()">インポート</button>${db.f.length?'<button class=o onclick="dl(\'wordtile-all\',{wt:1,folders:db.f})">全部エクスポート</button>':''}</div>`+(db.f.map((f,i)=>`<div class=card onclick="fol(${i})"><b>${esc(f.name)}</b><small>${f.items.length}文 ›</small></div>`).join('')||'<p class=m>フォルダーがありません。追加してください。</p>'))}
function addF(){const n=prompt('フォルダー名');if(!n)return;db.f.push({id:uid(),name:n,items:[]});save();fol(db.f.length-1)}
function imp(){pick(async fs=>{let n=0;for(const f of fs){try{const d=JSON.parse(await f.text());(d.folders||[]).forEach(x=>{x.id=uid();db.f.push(x);n++})}catch(e){alert(f.name+' は読み込めませんでした')}}save();home();alert(n+'個のフォルダーを追加しました')},1)}
function fol(i){const f=db.f[i];R(`<div class=row><button class=o onclick=home()>‹ ホーム</button><h2>${esc(f.name)}</h2></div><div class=row><button class="big" onclick=list(${i})>📝 文章一覧</button><button class="big" onclick=startP(${i})>🎯 実践</button></div><div class=row><button class=o onclick="ren(${i})">名前変更</button><button class=o onclick="dl(${JSON.stringify(f.name).replace(/"/g,'&quot;')},{wt:1,folders:[db.f[${i}]]})">エクスポート</button><button class=d onclick="delF(${i})">フォルダー削除</button></div>`)}
function ren(i){const n=prompt('新しい名前',db.f[i].name);if(n){db.f[i].name=n;save();fol(i)}}
function delF(i){if(confirm('このフォルダーを削除しますか？')){db.f.splice(i,1);save();home()}}

function list(i){const f=db.f[i];R(`<div class=row><button class=o onclick=fol(${i})>‹ 戻る</button><button onclick="edit(${i},-1)">＋ 文章を追加</button></div>`+(f.items.map((it,j)=>`<div class=card style="display:block"><div>${parse(it).map(p=>p.b?`<span class=bl>${th(p)}</span>`:esc(p.v)).join('')}</div><div class=row><button class=o onclick="edit(${i},${j})">編集</button><button class=d onclick="delI(${i},${j})">削除</button></div></div>`).join('')||'<p class=m>文章がありません</p>'))}
function delI(i,j){if(confirm('削除しますか？')){db.f[i].items.splice(j,1);save();list(i)}}

function edit(i,j){E={i,j,it:j<0?{id:uid(),src:'',imgs:{},dt:'',di:[],dummyOn:true}:JSON.parse(JSON.stringify(db.f[i].items[j]))};
R(`<div class=row><button class=o onclick=list(${i})>‹ 戻る</button><button onclick=saveI()>保存</button></div>
<p class=m>文章を入力し、穴にしたい部分を選択して「穴にする」。<br>{単語} と直接書いてもOK。</p>
<textarea id=ta placeholder="例: I {like} apples." oninput="E.it.src=this.value;pv()">${esc(E.it.src)}</textarea>
<div class=row><button onpointerdown="event.preventDefault()" onclick=mk()>選択を穴にする</button><button class=o onclick=imgBlank()>🖼 画像の穴</button></div>
<div class=sent id=pv></div>
<p><label><input type=checkbox ${E.it.dummyOn?'checked':''} onchange="E.it.dummyOn=this.checked"> ダミー選択肢を使う</label></p>
<input type=text id=dt placeholder="ダミー単語（、または , 区切り）" value="${esc(E.it.dt)}" oninput="E.it.dt=this.value">
<div class=row id=dimg></div><button class=o onclick=imgDum()>🖼 画像ダミー追加</button>`);pv();dm()}
function pv(){$('#pv').innerHTML=parse(E.it).map(p=>p.b?`<span class=bl>${th(p)||'?'}</span>`:esc(p.v)).join('')||'<span class=m>プレビュー</span>'}
function dm(){$('#dimg').innerHTML=E.it.di.map((v,k)=>`<span class=chip><img src="${v}"><b onclick="E.it.di.splice(${k},1);dm()">✕</b></span>`).join('')}
function mk(){const t=$('#ta'),s=t.selectionStart,e=t.selectionEnd;if(s==e)return alert('穴にする文字を選択してください');t.setRangeText('{'+t.value.slice(s,e)+'}',s,e,'end');E.it.src=t.value;pv()}
function imgBlank(){pick(async([f])=>{const k=uid();E.it.imgs[k]=await shrink(f);const t=$('#ta');t.setRangeText('{#'+k+'}',t.selectionStart,t.selectionEnd,'end');E.it.src=t.value;pv()})}
function imgDum(){pick(async fs=>{for(const f of fs)E.it.di.push(await shrink(f));dm()})}
function saveI(){const it=E.it;if(!parse(it).some(p=>p.b))return alert('穴が1つもありません');for(const k in it.imgs)if(!it.src.includes('{#'+k+'}'))delete it.imgs[k];const a=db.f[E.i].items;E.j<0?a.push(it):a[E.j]=it;save();list(E.i)}

function startP(i){const ids=db.f[i].items.map((_,k)=>k).filter(k=>parse(db.f[i].items[k]).some(p=>p.b));if(!ids.length)return alert('穴のある文章がありません');P={i,order:shuf(ids),n:0};q()}
function q(){const it=db.f[P.i].items[P.order[P.n]];P.parts=parse(it);P.ans=P.parts.filter(p=>p.b);P.tiles=shuf([...P.ans,...(it.dummyOn?dum(it):[])]);P.fill=P.ans.map(()=>-1);P.res=null;dp()}
function dp(){let k=0;const s=P.parts.map(p=>{if(!p.b)return esc(p.v);const x=k++,f=P.fill[x];return`<span class="slot ${P.res?(P.res[x]?'ok':'ng'):''}" onclick="un(${x})">${f>=0?`<span class=t>${th(P.tiles[f])}</span>`:''}</span>`}).join('');
const done=P.fill.every(x=>x>=0),last=P.n==P.order.length-1;
R(`<div class=row><button class=o onclick=fol(${P.i})>‹ 終了</button><small>${P.n+1} / ${P.order.length}</small></div><div class=sent>${s}</div><div class=tiles>${P.tiles.map((t,x)=>`<span class="t ${P.fill.includes(x)?'used':''}" onclick="tp(${x})">${th(t)}</span>`).join('')}</div>`+
(P.res?`<div class=msg>${P.res.every(x=>x)?'🎉 正解！':'ざんねん…'}</div><div class=row><button class=o onclick="q2()">もう一度</button>${last?`<button onclick=fol(${P.i})>終わり</button>`:'<button onclick="P.n++;q()">次へ ›</button>'}</div>`:`<button style="width:100%" ${done?'':'disabled'} onclick=chk()>答え合わせ</button>`))}
function tp(x){if(P.res||P.fill.includes(x))return;const s=P.fill.indexOf(-1);if(s<0)return;P.fill[s]=x;dp()}
function un(s){if(P.res)return;P.fill[s]=-1;dp()}
function chk(){P.res=P.fill.map((f,s)=>{const t=P.tiles[f],a=P.ans[s];return t.t==a.t&&t.v==a.v});dp()}
function q2(){P.fill=P.ans.map(()=>-1);P.res=null;dp()}
home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

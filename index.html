<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E5E5E5"><link rel="manifest" href="manifest.webmanifest"><title>ANAUME</title>
<style>
:root{--bg:#E5E5E5;--ac:#A499C9;--cd:#F3F2F8;--ln:#555;--tx:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px 120px}#app.pr{padding-bottom:260px}
h1{font-size:22px;font-weight:500;margin:0}small,.m{color:#777}
.hd{position:relative;text-align:center;padding:6px 0 16px}.bk{position:absolute;left:0;top:0;padding:8px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#2B2540;font-weight:500}
button.o{background:transparent;border:1px solid var(--ln);color:var(--tx)}button.d{background:transparent;border:1px solid var(--ln);color:#8D5966}button:disabled{opacity:.4}
.sg{flex:1;padding:18px 10px;font-size:17px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:18px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:24px;width:64px;height:64px;border-radius:50%;background:var(--cd);border:1px solid var(--ln);color:var(--tx);font-size:34px;padding:0;z-index:2}
textarea,input[type=text]{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--cd)}
textarea{min-height:110px}textarea:focus,input:focus{outline:0;border-color:var(--ac)}
.bl{border-bottom:3px solid var(--ac);font-weight:500;padding:0 4px}
.sent{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;line-height:2.4;white-space:pre-wrap}
.slot{display:inline-flex;min-width:64px;min-height:40px;border-bottom:3px solid var(--ac);vertical-align:middle;margin:0 3px;justify-content:center;align-items:center}
.t{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:6px 14px;min-height:44px;display:inline-flex;align-items:center}
.slot .t{min-height:36px;border:0;background:none;padding:0 6px}.slot .t.bad{background:#D7ACB7;color:#3B1F27;font-weight:500;border-radius:10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.t.used{opacity:.25}
.t img,.chip img{max-height:120px;max-width:170px;border-radius:6px}.t:has(img){padding:6px}
.chip{background:var(--cd);border-radius:8px;padding:4px 8px;display:inline-flex;gap:6px;align-items:center}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 18px;background:var(--bg);z-index:3}
.bot>*,.sheet .row2{max-width:528px;margin:0 auto}.wide{width:100%;padding:15px}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:18px 16px 20px;border-radius:24px 24px 0 0;border-top:1px solid var(--ln);z-index:4;animation:up .25s ease-out}
.sheet>*{max-width:528px;margin-left:auto;margin-right:auto}.sheet h3{margin:0 0 6px;font-size:20px;font-weight:500}
.sok{background:#A1B78A;color:#1F2E12}.sng{background:#D7ACB7;color:#3B1F27}
.ans{white-space:pre-wrap;line-height:2;margin:2px auto 14px}.ans .bl{border-color:currentColor}
.row2{display:flex;gap:8px}.row2 button{flex:1;padding:14px;border:1px solid var(--ln);color:var(--tx)}.rt{background:#E5E5E5}.nx{background:var(--cd)}
@keyframes up{from{transform:translateY(100%)}}
</style></head><body><div id="app"></div><input type="file" id="fi" hidden>
<script>
const $=s=>document.querySelector(s),R=(h,c)=>{const a=$('#app');a.className=c||'';a.innerHTML=h;scrollTo(0,0)};
let db=JSON.parse(localStorage.getItem('wt')||'{"f":[]}'),E,P,V={n:'home'};
const save=()=>localStorage.setItem('wt',JSON.stringify(db)),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const th=t=>t.t=='img'?`<img src="${t.v}">`:esc(t.v);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function parse(it){return it.src.split(/(\{[^}]*\})/).filter(x=>x).map(p=>{if(p[0]=='{'&&p.endsWith('}')){const v=p.slice(1,-1);return v[0]=='#'?{b:1,t:'img',v:(it.imgs||{})[v.slice(1)]||''}:{b:1,t:'text',v}}return{t:'text',v:p}})}
const dum=it=>[...(it.dt||'').split(/[,、，]/).map(s=>s.trim()).filter(Boolean).map(v=>({t:'text',v})),...(it.di||[]).map(v=>({t:'img',v}))];
const shrink=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
const pick=(cb,json)=>{const f=$('#fi');f.accept=json?'.json,application/json':'image/*';f.multiple=true;f.onchange=()=>{if(f.files.length)cb([...f.files]);f.value=''};f.click()};
const dl=(name,obj)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name+'.json';a.click()};
const sp=it=>parse(it).map(p=>p.b?`<span class=bl>${th(p)}</span>`:esc(p.v)).join('');
const hd=(t,s)=>`<div class=hd><button class="o bk" onclick="history.back()">‹</button><h1>${esc(t)}</h1><small>${s}</small></div>`;

function go(s){history.pushState(s,'');render(s)}
function render(s){V=s;({home,fol:()=>fol(s.i),list:()=>list(s.i),edit:()=>edit(s.i,s.j),prac:()=>P&&P.i==s.i&&!P.done?q():fol(s.i)})[s.n]()}
onpopstate=e=>{const s=e.state||{n:'home'};
if(V.n=='prac'&&P&&!P.done){if(P.res&&P.sheet){P.sheet=0;history.pushState(V,'');dp();return}
if((P.n>0||P.fill.some(x=>x>=0))&&!confirm('実践を終了しますか？')){history.pushState(V,'');return}}
if(V.n=='edit'&&E&&E.dirty&&!confirm('編集内容を破棄しますか？')){history.pushState(V,'');return}
render(s)};

function home(){R(`<div class=row><button class=o onclick=imp()>インポート</button>${db.f.length?'<button class=o onclick="dl(\'anaume-all\',{wt:1,folders:db.f})">全部エクスポート</button>':''}</div>`+(db.f.map((f,i)=>`<div class=card onclick="go({n:'fol',i:${i}})"><span>${esc(f.name)}</span><small>${f.items.length}</small></div>`).join('')||'<p class=m>フォルダーがありません。右下の + で追加できます。</p>')+`<button class=fab onclick=addF()>+</button>`)}
function addF(){const n=prompt('フォルダー名');if(!n)return;db.f.push({id:uid(),name:n,items:[]});save();go({n:'fol',i:db.f.length-1})}
function imp(){pick(async fs=>{let n=0;for(const f of fs){try{const d=JSON.parse(await f.text());(d.folders||[]).forEach(x=>{x.id=uid();db.f.push(x);n++})}catch(e){alert(f.name+' は読み込めませんでした')}}save();home();alert(n+'個のフォルダーを追加しました')},1)}
function fol(i){const f=db.f[i];R(hd(f.name,f.items.length+'文')+`<div class=row><button class="o sg" onclick="go({n:'list',i:${i}})">文章一覧</button><button class=sg onclick=startP(${i})>実践</button></div><div class=row><button class=o onclick="ren(${i})">名前変更</button><button class=o onclick="dl(db.f[${i}].name,{wt:1,folders:[db.f[${i}]]})">エクスポート</button><button class=d onclick="delF(${i})">フォルダー削除</button></div>`)}
function ren(i){const n=prompt('新しい名前',db.f[i].name);if(n){db.f[i].name=n;save();fol(i)}}
function delF(i){if(confirm('このフォルダーを削除しますか？')){db.f.splice(i,1);save();history.go(-1)}}

function list(i){const f=db.f[i];R(hd(f.name,'文章一覧')+(f.items.map((it,j)=>`<div class=card style="display:block"><div class=sent style="padding:0;background:none;border:0">${sp(it)}</div><div class=row><button class=o onclick="go({n:'edit',i:${i},j:${j}})">編集</button><button class=d onclick="delI(${i},${j})">削除</button></div></div>`).join('')||'<p class=m>文章がありません</p>')+`<button class=fab onclick="go({n:'edit',i:${i},j:-1})">+</button>`)}
function delI(i,j){if(confirm('削除しますか？')){db.f[i].items.splice(j,1);save();list(i)}}

function edit(i,j){E={i,j,dirty:0,it:j<0?{id:uid(),src:'',imgs:{},dt:'',di:[],dummyOn:true}:JSON.parse(JSON.stringify(db.f[i].items[j]))};
R(`<div class=row style="justify-content:space-between"><button class=o onclick="history.back()">‹ 戻る</button><button onclick=saveI()>保存</button></div>
<p class=m>文章を入力し、穴にしたい部分を選択して「選択を穴にする」。{単語} と直接書いてもOK。</p>
<textarea id=ta placeholder="例: I {like} apples." oninput="E.it.src=this.value;E.dirty=1;pv()">${esc(E.it.src)}</textarea>
<div class=row><button onpointerdown="event.preventDefault()" onclick=mk()>選択を穴にする</button><button class=o onclick=imgBlank()>画像の穴</button></div>
<div class=sent id=pv></div>
<p><label><input type=checkbox ${E.it.dummyOn?'checked':''} onchange="E.it.dummyOn=this.checked;E.dirty=1"> ダミー選択肢を使う</label></p>
<input type=text placeholder="ダミー単語（、または , 区切り）" value="${esc(E.it.dt)}" oninput="E.it.dt=this.value;E.dirty=1">
<div class=row id=dimg></div><button class=o onclick=imgDum()>画像ダミー追加</button>`);pv();dm()}
function pv(){$('#pv').innerHTML=parse(E.it).map(p=>p.b?`<span class=bl>${th(p)||'?'}</span>`:esc(p.v)).join('')||'<span class=m>プレビュー</span>'}
function dm(){$('#dimg').innerHTML=E.it.di.map((v,k)=>`<span class=chip><img src="${v}"><b onclick="E.it.di.splice(${k},1);E.dirty=1;dm()">✕</b></span>`).join('')}
function mk(){const t=$('#ta'),s=t.selectionStart,e=t.selectionEnd;if(s==e)return alert('穴にする文字を選択してください');t.setRangeText('{'+t.value.slice(s,e)+'}',s,e,'end');E.it.src=t.value;E.dirty=1;pv()}
function imgBlank(){pick(async fs=>{const t=$('#ta');for(const f of fs){const k=uid();E.it.imgs[k]=await shrink(f);t.setRangeText('{#'+k+'}',t.selectionStart,t.selectionEnd,'end')}E.it.src=t.value;E.dirty=1;pv()})}
function imgDum(){pick(async fs=>{for(const f of fs)E.it.di.push(await shrink(f));E.dirty=1;dm()})}
function saveI(){const it=E.it;if(!parse(it).some(p=>p.b))return alert('穴が1つもありません');for(const k in it.imgs)if(!it.src.includes('{#'+k+'}'))delete it.imgs[k];const a=db.f[E.i].items;E.j<0?a.push(it):a[E.j]=it;save();E.dirty=0;history.back()}

function startP(i){const ids=db.f[i].items.map((_,k)=>k).filter(k=>parse(db.f[i].items[k]).some(p=>p.b));if(!ids.length)return alert('穴のある文章がありません');P={i,order:shuf(ids),n:0};go({n:'prac',i})}
function q(){const it=db.f[P.i].items[P.order[P.n]];P.parts=parse(it);P.ans=P.parts.filter(p=>p.b);P.tiles=shuf([...P.ans,...(it.dummyOn?dum(it):[])]);P.fill=P.ans.map(()=>-1);P.res=null;P.sheet=0;dp()}
function dp(){let k=0;const s=P.parts.map(p=>{if(!p.b)return esc(p.v);const x=k++,f=P.fill[x];return`<span class=slot onclick="un(${x})">${f>=0?`<span class="t ${P.res&&!P.res[x]?'bad':''}">${th(P.tiles[f])}</span>`:''}</span>`}).join('');
const done=P.fill.every(x=>x>=0),last=P.n==P.order.length-1;let b;
if(!P.res)b=`<div class=bot><button class=wide ${done?'':'disabled'} onclick=chk()>答え合わせ</button></div>`;
else{const ok=P.res.every(x=>x),bt=`<div class=row2>${ok?'':'<button class=rt onclick=q2()>もう一度</button>'}<button class=nx onclick="${last?'end()':'P.n++;q()'}">${last?'終わり':'次へ'}</button></div>`;
b=P.sheet?`<div class="sheet ${ok?'sok':'sng'}"><h3>${ok?'正解':'不正解'}</h3>${ok?'':`<small style="color:inherit">正解</small><div class=ans>${sp({src:P.src||db.f[P.i].items[P.order[P.n]].src,imgs:db.f[P.i].items[P.order[P.n]].imgs})}</div>`}${bt}</div>`:`<div class=bot>${bt}</div>`}
R(`<div class=hd><button class="o bk" onclick="history.back()">‹</button><small>${P.n+1} / ${P.order.length}</small></div><div class=sent>${s}</div><div class=tiles>${P.tiles.map((t,x)=>`<span class="t ${P.fill.includes(x)?'used':''}" onclick="tp(${x})">${th(t)}</span>`).join('')}</div>`+b,'pr')}
function tp(x){if(P.res||P.fill.includes(x))return;const s=P.fill.indexOf(-1);if(s<0)return;P.fill[s]=x;dp()}
function un(s){if(P.res)return;P.fill[s]=-1;dp()}
function chk(){P.res=P.fill.map((f,s)=>{const t=P.tiles[f],a=P.ans[s];return t.t==a.t&&t.v==a.v});P.sheet=1;dp()}
function q2(){P.fill=P.ans.map(()=>-1);P.res=null;P.sheet=0;dp()}
function end(){P.done=1;history.back()}
history.replaceState(V,'');home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
